name: testtask

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: testtask
      POSTGRES_USER: testtask
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env or environment}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./.postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testtask -d testtask"]
      interval: 2s
      timeout: 5s
      retries: 30
